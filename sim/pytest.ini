[pytest]
testpaths = tests

# Sourcing ROS2 puts /opt/ros/humble's dist-packages on sys.path, which makes
# pytest autoload seven ROS packaging/lint plugins via their pytest11 entry
# points. None are relevant here, and launch_testing hard-fails on import
# because it needs PyYAML, which the venv does not have -- so with ROS sourced
# the whole suite errored before collecting a single test.
#
# Disabled explicitly rather than installing PyYAML to satisfy a plugin we do
# not use, and rather than PYTEST_DISABLE_PLUGIN_AUTOLOAD, which would also
# switch off plugins we might want later.
addopts =
    -p no:launch_testing
    -p no:launch_ros
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:ament_lint
    -p no:ament_pep257
    -p no:ament_xmllint
